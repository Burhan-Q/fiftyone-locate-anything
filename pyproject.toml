[project]
name = "fiftyone-locate-anything"
version = "0.1.0"
description = "FiftyOne Zoo remote model wrapping NVIDIA LocateAnything-3B"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fiftyone>=1.15.0",
    "huggingface-hub",
    "torch",
    "torchvision",
    "transformers>=4.57.1,<4.58",
    "tokenizers>=0.22.0",
    "Pillow",
    "numpy",
    "timm",
    # The HF model's modeling/processing files hard-import all of these at
    # module-load time (verified by inspection of modeling_locateanything.py
    # and processing_locateanything.py on the HF repo). So they're required
    # for any inference, not just video / training.
    "lmdb",
    "peft",
    "opencv-python-headless>=4.10",
    # decord has no arm64 macOS wheel; eva-decord is a fork that does and
    # registers as the `decord` module. Platform markers auto-pick.
    "decord; sys_platform != 'darwin'",
    "eva-decord; sys_platform == 'darwin'",
]

[project.optional-dependencies]
# Extras for the Eagle training pipeline; not required for inference.
training = [
    "accelerate",
    "liger-kernel",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]

[tool.pytest.ini_options]
# Project root has __init__.py (required by FiftyOne zoo loader) which uses
# package-relative imports. Dir name `fiftyone-locate-anything` has hyphens so it
# can't be a Python package. The conftest.py in .ref/tests loads zoo.py and
# dataset.py via importlib under synthetic module names.
#
# `confcutdir` prevents pytest from walking up past .ref/tests when looking
# for __init__.py / conftest.py. Without it, pytest sees the rootdir's
# __init__.py and tries to evaluate its relative imports.
addopts = "--import-mode=importlib --confcutdir=.ref/tests"
testpaths = [".ref/tests"]
