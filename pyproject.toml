[project]
name = "fo-locate-anything"
version = "0.1.0"
description = "FiftyOne Zoo remote model wrapping NVIDIA LocateAnything-3B"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fiftyone>=1.15.0",
    "huggingface-hub",
    "torch",
    "transformers>=4.57.1,<4.58",
    "tokenizers>=0.22.0",
    "Pillow",
    "numpy",
    "timm",
]

[project.optional-dependencies]
# Default video extra. opencv ships everywhere; native `decord` only installs
# on non-Mac platforms (it has no arm64 macOS wheel). MacOS users wanting
# decord opt in to `decord-mac` (eva-decord fork — imports as `decord`).
# Backend probe order at runtime: decord → cv2 → torchvision.io.
video = [
    "opencv-python-headless>=4.10",
    "decord; sys_platform != 'darwin'",
]
# Opt-in for arm64 MacOS — installs eva-decord (registers as `decord` module).
# Usage: pip install "fo-locate-anything[video,decord-mac]"
decord-mac = [
    "eva-decord; sys_platform == 'darwin'",
]
training = [
    "accelerate",
    "peft",
    "lmdb",
    "liger-kernel",
]
all = ["fo-locate-anything[video]"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]

[tool.pytest.ini_options]
# Project root has __init__.py (required by FiftyOne zoo loader) which uses
# package-relative imports. Dir name `fo-locate-anything` has hyphens so it
# can't be a Python package. The conftest.py in .ref/tests loads zoo.py and
# dataset.py via importlib under synthetic module names.
#
# `confcutdir` prevents pytest from walking up past .ref/tests when looking
# for __init__.py / conftest.py. Without it, pytest sees the rootdir's
# __init__.py and tries to evaluate its relative imports.
addopts = "--import-mode=importlib --confcutdir=.ref/tests"
testpaths = [".ref/tests"]
